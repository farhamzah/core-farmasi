name: Karir identity contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  identity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, gd, zip
          coverage: none
      - run: mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: php artisan test --do-not-cache-result tests/Feature/KarirIdentityVerificationTest.php tests/Feature/CoreApiClientCredentialTest.php
